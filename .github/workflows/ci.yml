name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sutriva_phasea_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sutriva_phasea_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sutriva_phasea_ci
      DATABASE_REQUIRED: "true"
      DATABASE_CONNECT_TIMEOUT: "3"
      PHASEA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sutriva_phasea_ci
      PHASEA_ALLOW_DESTRUCTIVE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
      - name: Verify PostgreSQL service health
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d sutriva_phasea_ci; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL service failed readiness checks after 30 attempts" >&2
          exit 1
      - name: Run API migrations
        run: cd services/api && alembic upgrade head
      - name: Run decision engine tests
        run: cd services/decision_engine && pytest
      - name: Run learning engine tests
        run: cd services/learning_engine && python -m pytest -q
      - name: Run API tests
        run: cd services/api && python -m pytest -q

  # No path filter on purpose: a required check that is skipped by a path
  # filter stays "pending" on PRs that do not touch the frontend, which would
  # block them once this check is added to branch protection.
  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - name: Install PWA dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript check
        run: npx --no-install tsc --noEmit
      - name: Build production bundle
        run: npm run build
