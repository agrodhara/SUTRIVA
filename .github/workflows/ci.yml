name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pydantic pytest
      - name: Run decision engine tests
        run: cd services/decision_engine && pytest
      - name: Run learning engine tests
        run: cd services/learning_engine && pytest
      - name: Run API tests
        run: cd services/api && pytest
